html,body{margin:0;padding:0}
:root{
  --px: min(0.052083vw, 0.0925926vh);   /* 1px of the 1920x1080 design grid */
  --mx:50%; --my:40%;
}
body{
  background:#1c4d85;
  color:#fff;
  font-family:'Manrope','Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}

/* ---------- stage ---------- */
.hero{
  position:relative;
  z-index:1;
  width:100%;
  height:100svh;
  min-height:600px;
  overflow:hidden;
}
/* soft landing into the works section (a gradient overlay, never a mask —
   see the note on .portrait) */
.hero::after{
  content:"";position:absolute;left:0;right:0;bottom:0;height:16%;z-index:3;
  pointer-events:none;
  background:linear-gradient(to bottom, rgba(9,28,58,0), rgba(9,28,58,.30));
}

/* ---------- background ---------- */
.bg{position:fixed;inset:0;z-index:0}
.bg-base{
  position:absolute;inset:0;
  background:

}
.tl-wrap{
  position:absolute;inset:-8% -6%;
  filter:blur(10px) saturate(.95);
  opacity:.45;
}
.tl{position:absolute;inset:0;width:100%;height:100%;display:block}
.tl-scroll{animation:tlpan 78s linear infinite}
.tl-playhead{animation:tlplay 26s linear infinite}

    radial-gradient(46% 62% at 52% 52%, rgba(8,28,58,.52) 0%, rgba(8,28,58,.22) 45%, rgba(8,28,58,0) 72%),
    radial-gradient(80% 50% at 50% 108%, rgba(6,22,48,.62), rgba(6,22,48,0) 70%);
}
.bg-vignette{
  position:absolute;inset:0;
  background:radial-gradient(115% 105% at 50% 45%, rgba(0,0,0,0) 52%, rgba(4,16,38,.45) 100%);
  mix-blend-mode:multiply;
}
.bg-grain{
  position:absolute;inset:0;opacity:.16;mix-blend-mode:overlay;pointer-events:none;
  background-image:var(--grain);background-size:180px 180px;
}

/* ---------- portrait ---------- */
/* NB: a mask ANYWHERE on this subtree makes Chrome cast a drop-shadow from the
   mask rectangle instead of the cut-out alpha — a wrapper does not help.
   So: the fade stays, the CSS shadow is gone, and the depth under the figure
   comes from .portrait-shade below. */
.portrait-shade{
  position:absolute;left:50%;bottom:0;z-index:0;pointer-events:none;
  width:calc(var(--px)*1180);height:calc(var(--px)*760);
  transform:translateX(-49%);
  background:radial-gradient(52% 62% at 50% 78%, rgba(4,18,42,.45), rgba(4,18,42,.18) 55%, rgba(4,18,42,0) 78%);
  /* must reach zero before the fold, otherwise its bottom edge is a visible step */
  -webkit-mask-image:linear-gradient(to bottom,#000 46%,rgba(0,0,0,0) 100%);
  mask-image:linear-gradient(to bottom,#000 46%,rgba(0,0,0,0) 100%);
}
.portrait-wrap{
  position:absolute;
  left:50%;
  bottom:0;
  transform:translateX(-44%);
  height:calc(var(--px) * 1020);
  width:auto;
  z-index:1;
  pointer-events:none;
  -webkit-mask-image:linear-gradient(to bottom,#000 68%,rgba(0,0,0,.72) 85%,rgba(0,0,0,0) 100%);
  mask-image:linear-gradient(to bottom,#000 68%,rgba(0,0,0,.72) 85%,rgba(0,0,0,0) 100%);
}
.portrait{
  display:block;height:100%;width:auto;
  user-select:none;-webkit-user-drag:none;
}

/* ---------- layout ---------- */
.stage{
  position:absolute;
  left:50%;top:50%;
  transform:translate(-50%,-50%);
  width:calc(var(--px)*1920);
  height:calc(var(--px)*1080);
  z-index:2;
}
.abs{position:absolute}
.stage > .glass-dark{position:absolute}

/* eyebrow */
.eyebrow{
  left:calc(var(--px)*187); top:calc(var(--px)*336);
  display:flex;align-items:center;gap:0;
  font-size:calc(var(--px)*21);
  letter-spacing:0;
  font-weight:400;
  color:rgba(255,255,255,.92);
  text-transform:uppercase;
  white-space:nowrap;
}
.eyebrow .dot{
  width:calc(var(--px)*11);height:calc(var(--px)*11);border-radius:50%;
  background:#fff;opacity:.95;flex:none;
  margin:0 calc(var(--px)*87);
}

/* glass words */
.gword{display:block}
.gw-refract{
  position:absolute;inset:0;pointer-events:none;
  -webkit-backdrop-filter:blur(7px) saturate(1.9) brightness(1.06);
  backdrop-filter:blur(7px) saturate(1.9) brightness(1.06);
  background:linear-gradient(150deg,
      rgba(255,255,255,.30) 0%,
      rgba(255,255,255,.10) 38%,
      rgba(196,224,255,.16) 62%,
      rgba(255,255,255,.34) 100%);
}
.gw-face{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.sheen{transform:translateX(-140%);animation:sheen 9s cubic-bezier(.5,0,.35,1) infinite}
@keyframes sheen{0%{transform:translateX(-140%)}55%,100%{transform:translateX(240%)}}

#w-roman{left:calc(var(--px)*181); top:calc(var(--px)*386); width:calc(var(--px)*672)}
#w-gbr{left:calc(var(--px)*624); top:calc(var(--px)*562); width:calc(var(--px)*374)}

/* subtitle */
.subtitle{
  left:calc(var(--px)*182); top:calc(var(--px)*536);
  width:calc(var(--px)*470);
  font-size:calc(var(--px)*33.6);
  line-height:calc(var(--px)*40);
  font-weight:400;
  color:#fff;
  text-shadow:0 calc(var(--px)*2) calc(var(--px)*16) rgba(6,22,48,.5);
}

/* button */
.btn{
  left:calc(var(--px)*182); top:calc(var(--px)*727);
  width:auto; height:calc(var(--px)*80);
  padding:0 calc(var(--px)*50);
  border-radius:calc(var(--px)*40);
  display:flex;align-items:center;justify-content:center;
  border:none;
  cursor:pointer;
  font-family:inherit;
  font-size:calc(var(--px)*33);
  font-weight:400;
  letter-spacing:.005em;
  color:#fff;
  text-decoration:none;
  transition:transform .5s cubic-bezier(.2,.8,.2,1), box-shadow .5s ease;
}
.btn:hover{transform:translateY(calc(var(--px)*-3))}
.btn:focus-visible{outline:2px solid #cfe6ff;outline-offset:calc(var(--px)*5)}
.btn span{position:relative;z-index:2}

/* right column */
.plate{
  left:calc(var(--px)*1343); top:calc(var(--px)*229);
  width:calc(var(--px)*336); height:calc(var(--px)*201);
  border-radius:calc(var(--px)*50);
  display:flex;align-items:center;justify-content:center;
  gap:calc(var(--px)*34);
}
.adobe-ico{
  width:calc(var(--px)*108);height:calc(var(--px)*107);
  border-radius:calc(var(--px)*23);
  display:flex;align-items:center;justify-content:center;
  font-family:'PoppinsIco','Manrope',sans-serif;
  font-weight:600;
  font-size:calc(var(--px)*67);
  letter-spacing:-.02em;
  position:relative;z-index:2;
  overflow:hidden;
  background:linear-gradient(152deg,
      rgba(255,255,255,.22) 0%,
      rgba(255,255,255,.07) 40%,
      rgba(188,214,255,.12) 66%,
      rgba(255,255,255,.24) 100%);
  -webkit-backdrop-filter:blur(11px) saturate(2) brightness(1.34);
  backdrop-filter:blur(11px) saturate(2) brightness(1.34);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.50),
    inset 0 0 0 1px rgba(255,255,255,.15),
    inset 0 calc(var(--px)*-1) 0 rgba(255,255,255,.12),
    inset 0 0 calc(var(--px)*34) rgba(var(--tint),.30),
    0 calc(var(--px)*8) calc(var(--px)*20) rgba(2,10,28,.35);
}
.ico-ae{--tint:150,132,255}
.ico-pr{--tint:120,164,255;
  width:calc(var(--px)*127);height:calc(var(--px)*124);
  border-radius:calc(var(--px)*27);font-size:calc(var(--px)*78)}
.adobe-ico span{
  position:relative;z-index:2;
  background:linear-gradient(158deg,#ffffff 0%,#dfe9ff 34%,#b3c6f7 60%,#ffffff 100%);
  -webkit-background-clip:text;background-clip:text;
  color:transparent;
}
.adobe-ico::after{
  content:"";position:absolute;z-index:1;
  top:-30%;left:0;width:55%;height:160%;
  background:linear-gradient(100deg, rgba(255,255,255,0), rgba(255,255,255,.20) 42%, rgba(255,255,255,.20) 58%, rgba(255,255,255,0));
  transform:translateX(-160%) rotate(8deg);
  animation:icoSheen 9s cubic-bezier(.5,0,.35,1) infinite;
  pointer-events:none;
}
.ico-pr::after{animation-delay:.55s}
@keyframes icoSheen{0%{transform:translateX(-160%) rotate(8deg)}55%,100%{transform:translateX(320%) rotate(8deg)}}
.cursor{
  position:absolute;
  left:75.3%; top:49.8%;
  width:30.7%;height:auto;z-index:4;
  filter:drop-shadow(0 calc(var(--px)*3) calc(var(--px)*6) rgba(0,0,0,.45));
}
.rabotayu{
  left:calc(var(--px)*1346); top:calc(var(--px)*445);
  font-size:calc(var(--px)*60);
  font-weight:400;
  letter-spacing:-.01em;
  color:#a8cdf0;
  text-shadow:0 calc(var(--px)*2) calc(var(--px)*18) rgba(6,22,48,.45);
}
.proglist{
  left:calc(var(--px)*1477); top:calc(var(--px)*534);
  font-size:calc(var(--px)*20);
  font-weight:700;
  line-height:calc(var(--px)*30);
  color:#fff;
  text-shadow:0 calc(var(--px)*2) calc(var(--px)*14) rgba(6,22,48,.5);
}

/* ---------- liquid glass (dark plates) ---------- */
.glass-dark{
  background:rgba(5,7,13,.60);
  -webkit-backdrop-filter:blur(22px) saturate(1.6) brightness(.85);
  backdrop-filter:blur(22px) saturate(1.6) brightness(.85);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.20),
    inset 0 0 0 1px rgba(255,255,255,.07),
    inset 0 calc(var(--px)*-2) calc(var(--px)*10) rgba(255,255,255,.05),
    0 calc(var(--px)*26) calc(var(--px)*60) rgba(3,14,34,.45);
}
.glass-dark::before{
  content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;
  background:
    radial-gradient(70% 120% at var(--mx) var(--my), rgba(255,255,255,.18), rgba(255,255,255,0) 60%),
    linear-gradient(160deg, rgba(255,255,255,.14) 0%, rgba(255,255,255,0) 34%, rgba(255,255,255,0) 66%, rgba(255,255,255,.08) 100%);
}
.glass-dark::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  border-radius:inherit;
  box-shadow:inset 0 0 calc(var(--px)*24) rgba(120,180,255,.10);
}
.btn:hover.glass-dark{
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.30),
    inset 0 0 0 1px rgba(255,255,255,.10),
    0 calc(var(--px)*32) calc(var(--px)*70) rgba(3,14,34,.55);
}

/* ---------- entrance ---------- */
.rise{opacity:0;transform:translateY(calc(var(--px)*26));animation:rise .95s cubic-bezier(.16,.84,.24,1) forwards}
@keyframes rise{to{opacity:1;transform:none}}
.portrait-wrap{opacity:0;animation:pop 1.25s cubic-bezier(.16,.84,.24,1) .05s forwards}
@keyframes pop{from{opacity:0;transform:translateX(-44%) translateY(calc(var(--px)*34)) scale(1.02)}to{opacity:1;transform:translateX(-44%)}}
.d1{animation-delay:.18s}.d2{animation-delay:.30s}.d3{animation-delay:.42s}
.d4{animation-delay:.54s}.d5{animation-delay:.64s}.d6{animation-delay:.74s}.d7{animation-delay:.84s}

@media (prefers-reduced-motion:reduce){
  .rise,.portrait-wrap{animation:none;opacity:1;transform:none}
  .portrait-wrap{transform:translateX(-44%)}
  .tl-scroll,.tl-playhead,.sheen,.adobe-ico::after{animation:none}
}

/* ---------- mobile / portrait ---------- */
@media (max-aspect-ratio:9/10), (max-width:760px){
  :root{--px:1px}
  .hero{height:auto;min-height:100svh}
  .stage{
    position:relative;left:auto;top:auto;transform:none;
    width:100%;height:auto;min-height:100svh;
    display:flex;flex-direction:column;align-items:flex-start;
    justify-content:center;
    gap:clamp(12px,3vw,20px);
    padding:clamp(26px,7vw,44px) clamp(20px,6vw,40px) clamp(34px,9vw,60px);
  }
  .abs,
  .stage > .glass-dark{position:relative;left:auto!important;top:auto!important}

  .eyebrow{order:1;font-size:clamp(9.5px,2.6vw,13px);letter-spacing:.12em;gap:0;flex-wrap:wrap;white-space:normal}
  .eyebrow .dot{margin:0 clamp(9px,2.6vw,16px);width:5px;height:5px}

  #w-roman{order:2;width:min(88vw,540px);margin-top:clamp(4px,1.5vw,10px)}

  .subtitle{order:4;width:min(88vw,460px);font-size:clamp(15px,4.1vw,20px);line-height:1.36;margin-top:clamp(6px,2vw,12px)}

  .btn{order:5;width:auto;padding:0 clamp(26px,7vw,40px);height:clamp(46px,12vw,58px);border-radius:999px;
       font-size:clamp(15px,4vw,19px);margin-top:clamp(8px,2.5vw,14px)}

  .plate{order:6;width:min(58vw,236px);height:clamp(98px,25vw,132px);
         border-radius:clamp(18px,5vw,26px);gap:clamp(10px,3vw,16px);
         margin-top:clamp(26px,9vw,54px)}
  .adobe-ico{width:clamp(56px,15vw,84px);height:clamp(56px,15vw,84px);
             border-radius:clamp(11px,3.2vw,16px);font-size:clamp(31px,8.7vw,48px)}
  .ico-pr{width:clamp(66px,17.6vw,99px);height:clamp(65px,17.2vw,97px);
          border-radius:clamp(13px,3.8vw,19px);font-size:clamp(36px,10.2vw,56px)}


  .rabotayu{order:7;font-size:clamp(26px,7.6vw,40px);margin-top:clamp(2px,1vw,6px)}
  .proglist{order:8;font-size:clamp(13px,3.5vw,17px);line-height:1.5}

  .portrait-wrap{
    height:min(62vh,540px);width:auto;
    left:auto;right:calc(-1 * clamp(40px,16vw,140px));bottom:0;
    transform:none;opacity:.30;
    animation:none;
    -webkit-mask-image:linear-gradient(to bottom,#000 52%,rgba(0,0,0,0) 96%);
    mask-image:linear-gradient(to bottom,#000 52%,rgba(0,0,0,0) 96%);
  }
  .portrait-shade{display:none}
  .tl-wrap{opacity:.38;filter:blur(12px)}
}
/* ================= works ================= */
.works{
  position:relative;z-index:1;

}
/* a scrim so the timeline stays a texture and the copy stays readable */
.works::before{

  background:linear-gradient(180deg, rgba(9,28,58,.30) 0%, rgba(9,28,58,.48) 18%, rgba(9,28,58,.58) 100%);

/* video card */

.poster{

.vfoot{
  display:flex;align-items:baseline;gap:clamp(10px,1vw,18px);
  margin-top:clamp(12px,1.1vw,20px);
}
.vtitle{
  font-size:clamp(15px,1.2vw,22px);font-weight:600;margin:0;
  flex:1 1 auto;min-width:0;
}
.vmeta{
  font-size:clamp(12px,.92vw,16px);color:rgba(255,255,255,.58);
  white-space:nowrap;font-variant-numeric:tabular-nums;
}
.more-cue{
  display:inline-flex;align-items:center;gap:.5em;
  font-size:clamp(12px,.92vw,16px);font-weight:600;color:rgba(255,255,255,.78);
  white-space:nowrap;
}
.more-cue svg{width:.8em;height:.8em;fill:currentColor;transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.vcard[aria-expanded="true"] .more-cue svg{transform:rotate(180deg)}

/* the expanding shelf */
.shelf{
  display:grid;grid-template-rows:0fr;
  transition:grid-template-rows .6s cubic-bezier(.2,.8,.2,1);
}
.shelf.open{grid-template-rows:1fr}
.shelf > div{overflow:hidden;min-height:0}
.shelf-inner{
  margin-top:clamp(18px,1.8vw,32px);
  padding:clamp(16px,1.5vw,28px);
  border-radius:clamp(16px,1.5vw,28px);
  background:rgba(5,7,13,.42);
  -webkit-backdrop-filter:blur(20px) saturate(1.5) brightness(.92);
  backdrop-filter:blur(20px) saturate(1.5) brightness(.92);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18), inset 0 0 0 1px rgba(255,255,255,.07);
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));
  gap:clamp(12px,1.3vw,24px);
  opacity:0;transform:translateY(-8px);
  transition:opacity .45s ease .1s, transform .5s cubic-bezier(.2,.8,.2,1) .1s;
}
.shelf.open .shelf-inner{opacity:1;transform:none}
.mini .poster{border-radius:clamp(10px,1vw,16px);box-shadow:inset 0 1px 0 rgba(255,255,255,.22), inset 0 0 0 1px rgba(255,255,255,.09), 0 10px 24px rgba(3,14,34,.38)}
.mini .vfoot{margin-top:clamp(9px,.8vw,14px)}
.mini .vtitle{font-size:clamp(12px,.95vw,17px);font-weight:500}
.mini .vmeta{font-size:clamp(11px,.8vw,14px)}
a.mini{text-decoration:none;color:inherit;display:block}

.reveal{opacity:0;transform:translateY(26px)}
.reveal.in{opacity:1;transform:none;transition:opacity .8s ease, transform .8s cubic-bezier(.16,.84,.24,1)}

@media (max-width:860px){
  .row{grid-template-columns:1fr;gap:clamp(20px,5vw,32px)}
  .shelf-inner{grid-template-columns:1fr;gap:14px}
  .works-head{width:100%}
}
@media (prefers-reduced-motion:reduce){
  .reveal{opacity:1;transform:none}
  .shelf,.shelf-inner,.poster,.play{transition:none}
}

<script>
(function(){
  /* ---------- background: Premiere-style timeline, built from shapes ---------- */
  var W=2600,H=1500;
  var seed=20260823;
  function rnd(){ seed=(seed*1664525+1013904223)%4294967296; return seed/4294967296; }
  function r(a,b){ return a+(b-a)*rnd(); }
  function ri(a,b){ return Math.round(r(a,b)); }

  var CLIP=['#5c58c9','#3f86c8','#35a99b','#6a68d0','#2a63a6','#4a93c0','#7a5cc0','#3a8fb0'];
  function lighten(hex,k){
    var n=parseInt(hex.slice(1),16), R=(n>>16)&255, G=(n>>8)&255, B=n&255;
    R=Math.round(R+(255-R)*k); G=Math.round(G+(255-G)*k); B=Math.round(B+(255-B)*k);
    return 'rgb('+R+','+G+','+B+')';
  }
  var s=[];

  /* time ruler */
  s.push('<g opacity=".5">');
  s.push('<rect x="0" y="18" width="'+W+'" height="46" fill="rgba(255,255,255,.05)"/>');
  for(var x=-40;x<W+400;x+=34){
    var big=(Math.round(x/34)%5===0);
    s.push('<rect x="'+x+'" y="'+(big?34:44)+'" width="2" height="'+(big?26:14)+'" rx="1" fill="rgba(255,255,255,'+(big?.5:.28)+')"/>');
  }
  s.push('</g>');

  /* track head panel */
  s.push('<g opacity=".55">');
  s.push('<rect x="-40" y="78" width="212" height="1360" rx="14" fill="rgba(4,18,40,.30)"/>');
  s.push('</g>');

  var y=92, tracks=[];
  for(var i=0;i<5;i++){ tracks.push({y:y,h:116,audio:false}); y+=116+13; }
  for(var j=0;j<3;j++){ tracks.push({y:y,h:82,audio:true}); y+=82+13; }

  tracks.forEach(function(t,ti){
    /* track lane */
    s.push('<rect x="-60" y="'+t.y+'" width="'+(W+240)+'" height="'+t.h+'" rx="8" fill="rgba(255,255,255,.045)"/>');
    /* head chips */
    s.push('<rect x="-20" y="'+(t.y+14)+'" width="150" height="'+(t.h-28)+'" rx="9" fill="rgba(255,255,255,.07)"/>');
    s.push('<circle cx="12" cy="'+(t.y+t.h/2)+'" r="9" fill="rgba(255,255,255,.22)"/>');
    s.push('<rect x="34" y="'+(t.y+t.h/2-5)+'" width="46" height="10" rx="5" fill="rgba(255,255,255,.20)"/>');
    s.push('<rect x="90" y="'+(t.y+t.h/2-5)+'" width="18" height="10" rx="5" fill="rgba(255,255,255,.14)"/>');
  });

  /* clips (this group pans) */
  s.push('<g class="tl-scroll">');
  tracks.forEach(function(t,ti){
    var cx = 180 + r(-120,180);
    while(cx < W+560){
      var w = t.audio ? ri(180,620) : ri(150,540);
      var col = CLIP[ri(0,CLIP.length-1)];
      var top = t.y+7, h = t.h-14;
      s.push('<g>');
      s.push('<rect x="'+cx+'" y="'+top+'" width="'+w+'" height="'+h+'" rx="9" fill="'+col+'" opacity="'+(t.audio?.42:.55)+'"/>');
      s.push('<rect x="'+cx+'" y="'+top+'" width="'+w+'" height="20" rx="9" fill="'+lighten(col,.42)+'" opacity=".85"/>');
      s.push('<rect x="'+(cx+10)+'" y="'+(top+7)+'" width="'+Math.max(24,w*r(.18,.45))+'" height="7" rx="3.5" fill="rgba(255,255,255,.55)"/>');
      if(t.audio){
        /* waveform */
        var mid = top+h/2+6, n=Math.floor(w/9);
        var wf='';
        for(var k=0;k<n;k++){
          var a=Math.abs(Math.sin(k*.55+ti)*Math.sin(k*.17+2))*(h/2-14)+3;
          wf+='<rect x="'+(cx+7+k*9)+'" y="'+(mid-a)+'" width="4" height="'+(a*2)+'" rx="2" fill="rgba(255,255,255,.40)"/>';
        }
        s.push(wf);
      }else{
        /* filmstrip cells */
        var cells=Math.floor((w-16)/58);
        for(var c=0;c<cells;c++){
          s.push('<rect x="'+(cx+9+c*58)+'" y="'+(top+27)+'" width="52" height="'+(h-36)+'" rx="4" fill="rgba(255,255,255,'+r(.05,.13).toFixed(3)+')"/>');
        }
        /* keyframe line on some clips */
        if(rnd()>.62){
          var ky=top+h-16;
          s.push('<rect x="'+(cx+8)+'" y="'+(ky-1)+'" width="'+(w-16)+'" height="2" rx="1" fill="rgba(255,255,255,.35)"/>');
          var kn=ri(2,4);
          for(var q=0;q<kn;q++){
            var kx=cx+22+q*((w-44)/Math.max(1,kn-1||1));
            s.push('<rect x="'+(kx-5)+'" y="'+(ky-5)+'" width="10" height="10" fill="#fff" opacity=".8" transform="rotate(45 '+kx+' '+ky+')"/>');
          }
        }
      }
      s.push('</g>');
      cx += w + ri(6,90);
    }
  });
  s.push('</g>');

  /* playhead */
  s.push('<g class="tl-playhead" opacity=".9">');
  s.push('<rect x="518" y="24" width="3" height="'+(y-10)+'" fill="rgba(255,255,255,.85)"/>');
  s.push('<path d="M504 24 h32 v20 l-16 16 l-16 -16 z" fill="#ffffff" opacity=".92"/>');
  s.push('</g>');

  /* selection outline for a bit of life */
  document.getElementById('tl').innerHTML = s.join('');

  /* ---------- pointer-reactive specular on the glass ---------- */
  var hero=document.getElementById('hero');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(!reduce && window.matchMedia('(hover:hover)').matches){
    var raf=null, tx=50, ty=40;
    hero.addEventListener('pointermove', function(e){
      var b=hero.getBoundingClientRect();
      tx=((e.clientX-b.left)/b.width)*100;
      ty=((e.clientY-b.top)/b.height)*100;
      if(!raf) raf=requestAnimationFrame(function(){
        raf=null;
        document.documentElement.style.setProperty('--mx', tx.toFixed(2)+'%');
        document.documentElement.style.setProperty('--my', ty.toFixed(2)+'%');
      });
    });
    /* very light parallax on the background + portrait */
    var pt=document.getElementById('portrait'), bgw=document.querySelector('.tl-wrap');
    hero.addEventListener('pointermove', function(e){
      var b=hero.getBoundingClientRect();
      var nx=((e.clientX-b.left)/b.width-.5), ny=((e.clientY-b.top)/b.height-.5);
      bgw.style.transform='translate('+(nx*-22).toFixed(1)+'px,'+(ny*-14).toFixed(1)+'px)';
      pt.style.setProperty('--par', '1');
      pt.style.marginLeft=(nx*10).toFixed(1)+'px';
    });
  }
})();
</script>

    if(w.quote) html += '<blockquote class="quote"><p>«'+esc(w.quote.text)+'»</p>'+
                        '<footer><cite>'+esc(w.quote.author)+'</cite></footer></blockquote>';
    html +=     '</div>';
    html +=     '<div class="col-vid">';
    var more = w.more || [], href = link(w.main);
    if(more.length){
      html +=     '<button class="vcard" type="button" aria-expanded="false" aria-controls="shelf-'+i+'">';
      html +=       poster(w.main, 1000+i*7);
      html +=       '<span class="vfoot">';
      html +=         titleCell(w.main);
      if(w.main.meta) html += '<span class="vmeta">'+esc(w.main.meta)+'</span>';
      html +=         '<span class="more-cue">ещё '+more.length+' '+CHEV+'</span>';
      html +=       '</span>';
      html +=     '</button>';
      if(href) html += '<p class="vfoot" style="margin-top:0"><a class="watch" href="'+esc(href)+
                       '" target="_blank" rel="noopener">Смотреть на YouTube &rarr;</a></p>';
    } else {
      /* один ролик — раскрывать нечего, карточка сама ведёт на YouTube */
      html +=     '<a class="vcard" href="'+esc(href)+'" target="_blank" rel="noopener">';
      html +=       poster(w.main, 1000+i*7);
      html +=       '<span class="vfoot">';
      html +=         titleCell(w.main);
      if(w.main.meta) html += '<span class="vmeta">'+esc(w.main.meta)+'</span>';
      html +=         '<span class="more-cue">Смотреть на YouTube &rarr;</span>';
      html +=       '</span>';
      html +=     '</a>';
    }
    html +=     '</div>';
    html +=   '</div>';
    if(more.length){
    html +=   '<div class="shelf" id="shelf-'+i+'"><div><div class="shelf-inner">';
    html +=         more.map(function(v,k){
                      var inner = poster(v, 2000+i*31+k*5) +
                        '<span class="vfoot">'+titleCell(v)+
                        (v.meta?'<span class="vmeta">'+esc(v.meta)+'</span>':'')+'</span>';
                      var href=link(v);
                      return href
                        ? '<a class="mini" href="'+esc(href)+'" target="_blank" rel="noopener">'+inner+'</a>'
                        : '<div class="mini">'+inner+'</div>';
                    }).join('');
    html +=   '</div></div></div>';
    }
    html += '</div>';
  });
  rows.innerHTML = html;

  /* CSP опубликованного артефакта режет внешние картинки — тогда остаётся заглушка */
  rows.querySelectorAll('.poster img').forEach(function(im){
    im.addEventListener('error', function(){
      if(im.dataset.alt){ var a=im.dataset.alt; delete im.dataset.alt; im.src=a; }
      else im.remove();
    });
  });

  rows.querySelectorAll('.vtitle[data-yt]').forEach(function(el){
    var id=el.dataset.yt; if(!id) return;
    fetch('https://www.youtube.com/oembed?format=json&url=https%3A%2F%2Fwww.youtube.com%2Fwatch%3Fv%3D'+encodeURIComponent(id))
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(j){ if(j && j.title) el.textContent=j.title; })
      .catch(function(){});
  });

  rows.addEventListener('click', function(e){
    var btn = e.target.closest ? e.target.closest('.vcard') : null;
    if(!btn) return;
    var shelf = document.getElementById(btn.getAttribute('aria-controls'));
    var open = btn.getAttribute('aria-expanded') === 'true';
    btn.setAttribute('aria-expanded', open ? 'false' : 'true');
    shelf.classList.toggle('open', !open);
  });

  /* появление при скролле */
  var items = document.querySelectorAll('.reveal');
  if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches && 'IntersectionObserver' in window){
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(en){
        if(en.isIntersecting){ en.target.classList.add('in'); io.unobserve(en.target); }
      });
    }, {rootMargin:'0px 0px -12% 0px', threshold:.12});
    items.forEach(function(el){ io.observe(el); });
  } else {
    items.forEach(function(el){ el.classList.add('in'); });
  }
})();
</script>

</body>
</html>
